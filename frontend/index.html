<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First dApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 My First dApp</h1>
            <p class="subtitle">A simple decentralized application to get you started</p>
        </header>

        <div class="wallet-section">
            <button id="connectWallet" class="btn btn-primary">Connect Wallet</button>
            <div id="walletInfo" class="wallet-info" style="display: none;">
                <p>Connected: <span id="accountAddress"></span></p>
                <p>Network: <span id="networkName"></span></p>
            </div>
        </div>

        <div class="dapp-section">
            <h2>Simple Storage Contract</h2>
            <div class="card">
                <div class="form-group">
                    <label for="storageValue">Enter a number to store:</label>
                    <input type="number" id="storageValue" placeholder="Enter a number">
                    <button id="setValueBtn" class="btn btn-secondary">Store Value</button>
                </div>
                <div class="form-group">
                    <button id="getValueBtn" class="btn btn-secondary">Get Stored Value</button>
                    <p id="storedValue" class="result"></p>
                </div>
            </div>

            <h2>Token Contract</h2>
            <div class="card">
                <div class="form-group">
                    <button id="getBalanceBtn" class="btn btn-secondary">Check My Balance</button>
                    <p id="tokenBalance" class="result"></p>
                </div>
                <div class="form-group">
                    <label for="transferAddress">Recipient Address:</label>
                    <input type="text" id="transferAddress" placeholder="0x...">
                    <label for="transferAmount">Amount:</label>
                    <input type="number" id="transferAmount" placeholder="Amount">
                    <button id="transferBtn" class="btn btn-secondary">Transfer Tokens</button>
                </div>
            </div>
        </div>

        <div class="status-section">
            <p id="statusMessage" class="status"></p>
        </div>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
